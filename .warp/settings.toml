[appearance]
spacing = "normal"

[appearance.themes]
system_theme = false
theme = { custom = { name = "Ayu Mirage", path = "/Users/deniz/.warp/themes/ayu_mirage.yaml" } }

[appearance.vertical_tabs]
enabled = false
view_mode = "compact"
display_granularity = "panes"
primary_info = "command"

[appearance.icon]
app_icon = "original"

[appearance.window]
override_opacity = 80
override_blur = 64

[appearance.text]
font_name = "CaskaydiaCove Nerd Font Mono"
font_weight = "bold"
notebook_font_size = 14.0
font_size = 16.0
ligature_rendering_enabled = true
line_height_ratio = 1.600000023841858
match_notebook_to_monospace_font_size = false

[appearance.tabs]
show_indicators_button = true

[code]

[code.editor]
show_code_review_button = true
show_project_explorer = true
show_global_search = true

[warp_drive]
enabled = false

[agents]
cloud_conversation_storage_enabled = true

[agents.third_party]
should_render_cli_agent_toolbar = true

[agents.warp_agent]
is_any_ai_enabled = false

[agents.warp_agent.other]
show_agent_notifications = true

[agents.warp_agent.input]
nld_in_terminal_enabled = false

[terminal]

[terminal.input]
honor_ps1 = false
input_box_type_setting = "universal"
alias_expansion_enabled = false

[notifications]
toast_duration_secs = 8

[notifications.preferences]
is_agent_task_completed_enabled = true
is_long_running_enabled = true
is_needs_attention_enabled = true
is_password_prompt_enabled = true
long_running_threshold = 30
mode = "dismissed"
play_notification_sound = true

[general]
show_warning_before_quitting = false

[keys]
ctrl_tab_behavior_setting = "cycle_most_recent_tab"

[account]
is_settings_sync_enabled = true

[privacy]
telemetry_enabled = true
crash_reporting_enabled = true
