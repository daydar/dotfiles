[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

# python
[[language]]
name = "python"
language-servers = ["basedpyright", "ruff", "harper-ls"]
auto-format = true

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[language.formatter]
command = "ruff"
args = ["format", "-"]

# rust
[[language]]
name = "rust"
language-servers = ["rust-analyzer", "harper-ls"]
auto-format = true

[language.formatter]
command = "rustfmt"
args = ["--emit", "stdout"]

# zig
[[language]]
name = "zig"
language-servers = ["zls", "harper-ls"]
auto-format = true
